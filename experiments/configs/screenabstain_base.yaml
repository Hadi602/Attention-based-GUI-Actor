"# ScreenAbstain — base config (ablation: refusal head only, no margin)
# This is the smallest reproducible run, useful for sanity-checking
# the training loop on a small subset before scaling to the full
# manifest.

dataset:
  clean_manifest: data/manifests/clean_train.jsonl
  refusal_manifest: data/manifests/refusal_train.jsonl
  refusal_fraction: 0.4
  patch_grid: [36, 36]

# Dotted import path to a zero-arg callable that returns the
# GUI-Actor backbone with vision encoder + LM. Output of forward
# must include {\"action_query\", \"patch_embeddings\", \"patch_mask\"}.
backbone_path: \"src.models.gui_actor_backbone:build_backbone\"

# Dotted import path to a callable taking (List[PIL.Image], List[str])
# and returning a dict of model inputs (pixel_values, input_ids, ...).
processor_path: \"src.models.gui_actor_backbone:build_processor\"

head:
  hidden_dim: 3584          # Qwen2-VL-7B hidden size
  patch_dim: 3584
  tau: 1.0
  tau_null: 1.0
  init_null_scale: 0.001
  use_proj: true

loss:
  lambda_ref: 1.0
  lambda_margin: 0.0
  margin_low: 0.1
  margin_high: 0.7
  label_smoothing: 0.0

train:
  epochs: 3
  batch_size: 4
  num_workers: 2
  lr: 5.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  amp: true
  log_every: 25
  train_full_head: true
"
